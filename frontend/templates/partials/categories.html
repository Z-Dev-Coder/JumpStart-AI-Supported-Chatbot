{% load static %}
{% for cat in categories %}
<a href="/products/?category={{ cat.slug }}"
   class="flex flex-col items-center gap-3 p-5 rounded-2xl border border-gray-100 dark:border-gray-800
          bg-white dark:bg-gray-900 hover:border-brand-orange/40 hover:bg-brand-orange/5 dark:hover:bg-brand-orange/10
          transition-all duration-200 cursor-pointer group reveal"
   data-aos="fade-up" data-aos-delay="{{ forloop.counter0 }}00">
  <div class="w-14 h-14 rounded-2xl bg-brand-orange/10 flex items-center justify-center
              group-hover:bg-brand-orange group-hover:text-white transition-all duration-300">
    <i data-lucide="{{ cat.icon|default:'tag' }}" class="w-6 h-6 text-brand-orange group-hover:text-white transition-colors"></i>
  </div>
  <span class="text-sm font-semibold text-gray-700 dark:text-gray-300 group-hover:text-brand-orange dark:group-hover:text-brand-orange transition-colors text-center leading-tight">
    {{ cat.name }}
  </span>
</a>
{% empty %}
<div class="col-span-full text-center py-8 text-gray-400 text-sm">No categories yet.</div>
{% endfor %}
